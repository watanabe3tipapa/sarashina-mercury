name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "sarashina_api_uxui_guide.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /sarashina-mercury/app/
      APP_BASE: /sarashina-mercury/app/
      SITE_BASE: /sarashina-mercury/
      # Optional: set a repository variable named SARASHINA_API_BASE (e.g. your
      # deployed Cloudflare Worker URL) so the browser build can reach the API
      # without CORS errors. See the README for details.
      VITE_SARASHINA_API_BASE: ${{ vars.SARASHINA_API_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test:run

      - name: Build app
        run: pnpm build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp -R dist _site/app
          cp sarashina_api_uxui_guide.html _site/guide.html
          node scripts/build-404.mjs _site/app/index.html _site/404.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
